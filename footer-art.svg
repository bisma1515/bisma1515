<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Synthwave night city skyline footer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Synthwave night city</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03050f"/>
      <stop offset="0.6" stop-color="#0a1230"/>
      <stop offset="1" stop-color="#2a0f4a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd86b"/>
      <stop offset="0.5" stop-color="#ff5fa2"/>
      <stop offset="1" stop-color="#8a2be2"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b0b3a"/>
      <stop offset="1" stop-color="#05010f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="sunMask">
      <rect width="1200" height="300" fill="#fff"/>
      <rect x="0" y="165" width="1200" height="4" fill="#000"/>
      <rect x="0" y="178" width="1200" height="5" fill="#000"/>
      <rect x="0" y="191" width="1200" height="7" fill="#000"/>
      <rect x="0" y="203" width="1200" height="7" fill="#000"/>
    </mask>
    <clipPath id="aboveHorizon"><rect x="0" y="0" width="1200" height="210"/></clipPath>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="300" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="90" cy="30" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="60" r="1"/>
    <circle cx="380" cy="25" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="55" r="1"/>
    <circle cx="640" cy="22" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="65" r="1"/>
    <circle cx="880" cy="30" r="1.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="58" r="1"/>
    <circle cx="1100" cy="25" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1170" cy="70" r="1"/>
    <circle cx="450" cy="90" r="1"/>
    <circle cx="960" cy="95" r="1"/>
  </g>

  <!-- Sun -->
  <g clip-path="url(#aboveHorizon)">
    <circle cx="270" cy="160" r="95" fill="url(#sun)" mask="url(#sunMask)" opacity="0.95"/>
  </g>

  <!-- Small tagline -->
  <text x="1140" y="62" text-anchor="end" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" letter-spacing="6" fill="#7aa2ff" opacity="0.75">KEEP BUILDING</text>

  <!-- Back skyline -->
  <g fill="#0b1130">
    <rect x="0" y="130" width="60" height="80"/>
    <rect x="70" y="110" width="45" height="100"/>
    <rect x="125" y="140" width="70" height="70"/>
    <rect x="205" y="120" width="50" height="90"/>
    <rect x="265" y="150" width="60" height="60"/>
    <rect x="335" y="105" width="40" height="105"/>
    <rect x="385" y="135" width="80" height="75"/>
    <rect x="475" y="115" width="55" height="95"/>
    <rect x="540" y="145" width="65" height="65"/>
    <rect x="615" y="100" width="45" height="110"/>
    <rect x="670" y="130" width="70" height="80"/>
    <rect x="750" y="120" width="50" height="90"/>
    <rect x="810" y="150" width="60" height="60"/>
    <rect x="880" y="110" width="45" height="100"/>
    <rect x="935" y="135" width="75" height="75"/>
    <rect x="1020" y="105" width="55" height="105"/>
    <rect x="1085" y="140" width="60" height="70"/>
    <rect x="1155" y="120" width="45" height="90"/>
  </g>

  <!-- Neon rooftop edges -->
  <g stroke-width="2" filter="url(#glow)">
    <line x1="70" y1="110" x2="115" y2="110" stroke="#00e5ff" opacity="0.8"/>
    <line x1="335" y1="105" x2="375" y2="105" stroke="#00e5ff" opacity="0.8"/>
    <line x1="615" y1="100" x2="660" y2="100" stroke="#ff4fd8" opacity="0.8"/>
    <line x1="880" y1="110" x2="925" y2="110" stroke="#00e5ff" opacity="0.8"/>
    <line x1="1020" y1="105" x2="1075" y2="105" stroke="#ff4fd8" opacity="0.8"/>
  </g>

  <!-- Antennas + blinking lights -->
  <g stroke="#1a2250" stroke-width="2">
    <line x1="355" y1="105" x2="355" y2="82"/>
    <line x1="637" y1="100" x2="637" y2="76"/>
    <line x1="1047" y1="105" x2="1047" y2="84"/>
  </g>
  <g fill="#ff2a4d">
    <circle cx="355" cy="80" r="2.5"><animate attributeName="opacity" values="1;0.1;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="637" cy="74" r="2.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="1047" cy="82" r="2.5"><animate attributeName="opacity" values="1;0.1;1" dur="2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Front skyline -->
  <g fill="#060a1a">
    <rect x="20" y="165" width="50" height="45"/>
    <rect x="90" y="150" width="40" height="60"/>
    <rect x="150" y="175" width="70" height="35"/>
    <rect x="240" y="160" width="45" height="50"/>
    <rect x="305" y="180" width="60" height="30"/>
    <rect x="390" y="155" width="38" height="55"/>
    <rect x="450" y="170" width="70" height="40"/>
    <rect x="540" y="150" width="42" height="60"/>
    <rect x="610" y="178" width="55" height="32"/>
    <rect x="690" y="160" width="48" height="50"/>
    <rect x="760" y="172" width="62" height="38"/>
    <rect x="850" y="150" width="40" height="60"/>
    <rect x="920" y="168" width="58" height="42"/>
    <rect x="1000" y="155" width="45" height="55"/>
    <rect x="1070" y="175" width="65" height="35"/>
    <rect x="1145" y="160" width="40" height="50"/>
  </g>

  <!-- Windows -->
  <g fill="#ffd86b" opacity="0.85">
    <rect x="30" y="175" width="4" height="4"/><rect x="44" y="188" width="4" height="4"/>
    <rect x="98" y="160" width="4" height="4"/><rect x="112" y="176" width="4" height="4"/>
    <rect x="250" y="170" width="4" height="4"/><rect x="266" y="186" width="4" height="4"/>
    <rect x="398" y="165" width="4" height="4"/><rect x="412" y="182" width="4" height="4"/>
    <rect x="548" y="160" width="4" height="4"/><rect x="564" y="178" width="4" height="4"/>
    <rect x="698" y="170" width="4" height="4"/><rect x="716" y="188" width="4" height="4"/>
    <rect x="858" y="160" width="4" height="4"/><rect x="872" y="180" width="4" height="4"/>
    <rect x="1008" y="165" width="4" height="4"/><rect x="1024" y="184" width="4" height="4"/>
  </g>
  <g fill="#00e5ff" opacity="0.7">
    <rect x="160" y="186" width="4" height="4"/><rect x="190" y="194" width="4" height="4"/>
    <rect x="460" y="182" width="4" height="4"/><rect x="494" y="194" width="4" height="4"/>
    <rect x="770" y="184" width="4" height="4"/><rect x="800" y="194" width="4" height="4"/>
    <rect x="930" y="180" width="4" height="4"/><rect x="960" y="192" width="4" height="4"/>
    <rect x="1080" y="186" width="4" height="4"/><rect x="1110" y="194" width="4" height="4"/>
  </g>

  <!-- Floor -->
  <rect x="0" y="210" width="1200" height="90" fill="url(#floor)"/>
  <g stroke="#ff4fd8" stroke-width="1" opacity="0.55">
    <line x1="0" y1="220" x2="1200" y2="220"/>
    <line x1="0" y1="234" x2="1200" y2="234"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="276" x2="1200" y2="276"/>
    <line x1="600" y1="210" x2="-600" y2="300"/>
    <line x1="600" y1="210" x2="-300" y2="300"/>
    <line x1="600" y1="210" x2="0" y2="300"/>
    <line x1="600" y1="210" x2="300" y2="300"/>
    <line x1="600" y1="210" x2="600" y2="300"/>
    <line x1="600" y1="210" x2="900" y2="300"/>
    <line x1="600" y1="210" x2="1200" y2="300"/>
    <line x1="600" y1="210" x2="1500" y2="300"/>
    <line x1="600" y1="210" x2="1800" y2="300"/>
  </g>
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#00e5ff" stroke-width="2" filter="url(#glow)"/>
</svg>
