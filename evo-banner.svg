<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Rubisma Baruna Cakra - synthwave banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>RUBISMA BARUNA CAKRA</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03050f"/>
      <stop offset="0.6" stop-color="#0a1230"/>
      <stop offset="1" stop-color="#2a0f4a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd86b"/>
      <stop offset="0.5" stop-color="#ff5fa2"/>
      <stop offset="1" stop-color="#8a2be2"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b0b3a"/>
      <stop offset="1" stop-color="#05010f"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b8cff"/>
      <stop offset="0.55" stop-color="#1757d6"/>
      <stop offset="1" stop-color="#0a2a80"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16315f"/>
      <stop offset="1" stop-color="#060d20"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#ff4fd8"/>
    </linearGradient>
    <radialGradient id="beam" cx="0" cy="0.5" r="1">
      <stop offset="0" stop-color="#fff3b0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff3b0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rim" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e9f1ff"/>
      <stop offset="1" stop-color="#6c86b8"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="sunMask">
      <rect width="1200" height="400" fill="#fff"/>
      <rect x="0" y="262" width="1200" height="4" fill="#000"/>
      <rect x="0" y="278" width="1200" height="6" fill="#000"/>
      <rect x="0" y="295" width="1200" height="8" fill="#000"/>
      <rect x="0" y="312" width="1200" height="10" fill="#000"/>
    </mask>
    <clipPath id="aboveHorizon"><rect x="0" y="0" width="1200" height="328"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="40" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="90" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="30" r="1.6"><animate attributeName="opacity" values="1;0.3;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="440" cy="75" r="1"/>
    <circle cx="520" cy="35" r="1.3"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="60" r="1"/>
    <circle cx="740" cy="28" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="45" r="1.2"/>
    <circle cx="1080" cy="85" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="30" r="1"/>
    <circle cx="260" cy="150" r="1"/>
    <circle cx="1120" cy="160" r="1"/>
  </g>

  <!-- Synthwave sun -->
  <g clip-path="url(#aboveHorizon)">
    <circle cx="930" cy="240" r="115" fill="url(#sun)" mask="url(#sunMask)" opacity="0.95"/>
  </g>

  <!-- City skyline -->
  <g fill="#0a0f26">
    <rect x="0" y="278" width="40" height="50"/>
    <rect x="46" y="256" width="34" height="72"/>
    <rect x="86" y="290" width="50" height="38"/>
    <rect x="142" y="268" width="28" height="60"/>
    <rect x="176" y="284" width="46" height="44"/>
    <rect x="228" y="250" width="30" height="78"/>
    <rect x="264" y="288" width="52" height="40"/>
    <rect x="322" y="272" width="36" height="56"/>
    <rect x="364" y="292" width="44" height="36"/>
    <rect x="1040" y="274" width="38" height="54"/>
    <rect x="1084" y="252" width="30" height="76"/>
    <rect x="1120" y="284" width="48" height="44"/>
    <rect x="1172" y="268" width="28" height="60"/>
  </g>
  <g fill="#ffd86b" opacity="0.8">
    <rect x="52" y="264" width="4" height="4"/><rect x="62" y="276" width="4" height="4"/>
    <rect x="234" y="258" width="4" height="4"/><rect x="244" y="272" width="4" height="4"/>
    <rect x="1090" y="262" width="4" height="4"/><rect x="1100" y="278" width="4" height="4"/>
    <rect x="148" y="278" width="4" height="4"/><rect x="328" y="282" width="4" height="4"/>
  </g>

  <!-- Floor -->
  <rect x="0" y="328" width="1200" height="72" fill="url(#floor)"/>
  <g stroke="#ff4fd8" stroke-width="1" opacity="0.55">
    <line x1="0" y1="328" x2="1200" y2="328" stroke="#00e5ff" stroke-width="2" opacity="1"/>
    <line x1="0" y1="338" x2="1200" y2="338"/>
    <line x1="0" y1="352" x2="1200" y2="352"/>
    <line x1="0" y1="370" x2="1200" y2="370"/>
    <line x1="0" y1="393" x2="1200" y2="393"/>
    <line x1="600" y1="328" x2="-300" y2="400"/>
    <line x1="600" y1="328" x2="0" y2="400"/>
    <line x1="600" y1="328" x2="300" y2="400"/>
    <line x1="600" y1="328" x2="600" y2="400"/>
    <line x1="600" y1="328" x2="900" y2="400"/>
    <line x1="600" y1="328" x2="1200" y2="400"/>
    <line x1="600" y1="328" x2="1500" y2="400"/>
  </g>

  <!-- Text -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="62" y="128" font-size="14" letter-spacing="6" fill="#7aa2ff" opacity="0.9">INFORMATICS ENGINEERING STUDENT</text>
    <text x="60" y="190" font-size="46" font-weight="800" fill="url(#title)" filter="url(#glow)" textLength="540" lengthAdjust="spacingAndGlyphs">RUBISMA BARUNA CAKRA</text>
    <rect x="62" y="206" width="120" height="3" fill="#ff4fd8"/>
    <text x="62" y="248" font-size="22" fill="#cfe0ff" letter-spacing="4" font-family="'Noto Sans JP','Yu Gothic','Hiragino Sans','Meiryo',sans-serif">夢は、終わらない</text>
    <text x="62" y="272" font-size="12" letter-spacing="3" fill="#6f7fae">DREAMS NEVER END</text>
  </g>

  <!-- Car (local origin = rear-bottom of body, ground at y=138) -->
  <g transform="translate(640,190)">
    <!-- ground shadow + neon reflection -->
    <ellipse cx="262" cy="142" rx="285" ry="9" fill="#000" opacity="0.55"/>
    <ellipse cx="262" cy="144" rx="230" ry="4" fill="#00e5ff" opacity="0.25"/>

    <!-- headlight beam -->
    <polygon points="500,72 700,40 700,110 500,84" fill="url(#beam)"/>

    <!-- rear wing -->
    <rect x="26" y="46" width="5" height="16" fill="#08205a"/>
    <polygon points="-4,41 56,38 58,44 -2,47" fill="#0b2a6f"/>
    <polygon points="-4,41 56,38 56,40 -4,43" fill="#4d95ff"/>

    <!-- body -->
    <path d="M10,100 L8,72 Q10,64 24,62 L110,60 L172,24 Q176,20 184,20 L282,20 Q290,20 296,26 L366,58 L478,68 Q508,74 514,92 L516,102 L10,100 Z" fill="url(#body)" stroke="#0a2a80" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- windows -->
    <path d="M120,60 L176,29 L282,28 L290,33 L352,58 Z" fill="url(#glass)"/>
    <path d="M176,29 L282,28 L290,33 L216,33 Z" fill="#fff" opacity="0.08"/>
    <rect x="228" y="28" width="5" height="32" fill="#1757d6"/>

    <!-- bonnet vent -->
    <path d="M402,63 L444,67 L444,70 L402,66 Z" fill="#071a52"/>
    <path d="M410,63 L452,67" stroke="#071a52" stroke-width="2"/>

    <!-- body lines -->
    <path d="M18,80 L498,84" stroke="#7fb4ff" stroke-width="2" opacity="0.8" fill="none"/>
    <path d="M232,62 L228,96 M338,62 L342,96" stroke="#0a2a80" stroke-width="1.5" fill="none"/>
    <rect x="212" y="72" width="14" height="3" rx="1.5" fill="#cfe0ff"/>

    <!-- skirt + splitter + intake -->
    <rect x="140" y="96" width="196" height="5" rx="2" fill="#061a52"/>
    <rect x="478" y="100" width="44" height="3" fill="#061a52"/>
    <rect x="486" y="90" width="26" height="9" rx="2" fill="#030a22"/>

    <!-- lights -->
    <polygon points="482,70 510,77 508,85 480,80" fill="#fff6c0" filter="url(#glow)"/>
    <rect x="8" y="72" width="7" height="11" rx="2" fill="#ff2a4d" filter="url(#glow)"/>

    <!-- wheel arches -->
    <circle cx="105" cy="104" r="39" fill="#0a0f26"/>
    <circle cx="410" cy="104" r="39" fill="#0a0f26"/>

    <!-- wheels -->
    <g>
      <circle cx="105" cy="104" r="32" fill="#0b0b12"/>
      <circle cx="105" cy="104" r="22" fill="url(#rim)"/>
      <g stroke="#2a3a66" stroke-width="3">
        <line x1="105" y1="84" x2="105" y2="124"/><line x1="85" y1="104" x2="125" y2="104"/>
        <line x1="91" y1="90" x2="119" y2="118"/><line x1="119" y1="90" x2="91" y2="118"/>
      </g>
      <circle cx="105" cy="104" r="5" fill="#0b0b12"/>
    </g>
    <g>
      <circle cx="410" cy="104" r="32" fill="#0b0b12"/>
      <circle cx="410" cy="104" r="22" fill="url(#rim)"/>
      <g stroke="#2a3a66" stroke-width="3">
        <line x1="410" y1="84" x2="410" y2="124"/><line x1="390" y1="104" x2="430" y2="104"/>
        <line x1="396" y1="90" x2="424" y2="118"/><line x1="424" y1="90" x2="396" y2="118"/>
      </g>
      <circle cx="410" cy="104" r="5" fill="#0b0b12"/>
    </g>
  </g>
</svg>
