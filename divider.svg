<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40" width="1200" height="40" role="img" aria-label="divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#00e5ff"/>
      <stop offset="0.75" stop-color="#ff4fd8"/>
      <stop offset="1" stop-color="#ff4fd8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="50" y="19" width="1100" height="2" fill="url(#line)" filter="url(#glow)"/>
  <polygon points="600,8 612,20 600,32 588,20" fill="#0a1230" stroke="#ff4fd8" stroke-width="2" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/>
  </polygon>
  <circle cx="50" cy="20" r="3" fill="#00e5ff" filter="url(#glow)">
    <animate attributeName="cx" values="50;1150;50" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
