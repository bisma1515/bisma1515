<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160" role="img" aria-label="Informatics Engineering Student. Building better things, one commit at a time." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Informatics Engineering Student - Building better things, one commit at a time.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050818"/>
      <stop offset="1" stop-color="#150a33"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#ff4fd8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect x="10" y="10" width="1180" height="140" rx="14"/></clipPath>
  </defs>

  <rect x="10" y="10" width="1180" height="140" rx="14" fill="url(#bg)" stroke="url(#neon)" stroke-width="2"/>

  <!-- scanlines -->
  <g clip-path="url(#card)" opacity="0.12" stroke="#7aa2ff">
    <line x1="0" y1="30" x2="1200" y2="30"/><line x1="0" y1="50" x2="1200" y2="50"/>
    <line x1="0" y1="70" x2="1200" y2="70"/><line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="110" x2="1200" y2="110"/><line x1="0" y1="130" x2="1200" y2="130"/>
  </g>

  <!-- moving scan beam -->
  <g clip-path="url(#card)">
    <rect x="-200" y="10" width="160" height="140" fill="#00e5ff" opacity="0.07">
      <animate attributeName="x" from="-200" to="1200" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- corner brackets -->
  <g fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" filter="url(#glow)">
    <path d="M34 44 V34 H44"/><path d="M1166 44 V34 H1156"/>
    <path d="M34 116 V126 H44"/><path d="M1166 116 V126 H1156"/>
  </g>

  <!-- label -->
  <text x="600" y="48" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" letter-spacing="8" fill="#7aa2ff" opacity="0.85">&gt; RUBISMA BARUNA CAKRA</text>

  <!-- cycling lines -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="700" text-anchor="middle" fill="url(#neon)" filter="url(#glow)">
    <text x="600" y="100" font-size="38" letter-spacing="3" opacity="0">INFORMATICS ENGINEERING STUDENT
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.27;0.33;1" dur="9s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="100" font-size="38" letter-spacing="3" opacity="0">BUILDING BETTER THINGS
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.27;0.33;1" dur="9s" begin="3s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="100" font-size="38" letter-spacing="3" opacity="0">ONE COMMIT AT A TIME
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.27;0.33;1" dur="9s" begin="6s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- progress line -->
  <rect x="450" y="124" width="300" height="3" rx="1.5" fill="#1a2250"/>
  <rect x="450" y="124" width="0" height="3" rx="1.5" fill="url(#neon)" filter="url(#glow)">
    <animate attributeName="width" values="0;300;300;0" keyTimes="0;0.33;0.99;1" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
